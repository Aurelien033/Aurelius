tranche: 3
version: '0.1'
description: 'Tranche 3 adds evaluation harness, DreamBank sleep runner with zero-grad
  proof, and reproducibility pack generation. Smoke-scale (50-100 traces), not full
  200+ gate runs.

  '
seeds:
  base_seed: 6060
model:
  checkpoint_path: checkpoints/aurelius-1.3b
  variant: amc_1b_class
eval:
  trace_input: data/ring1_traces/tranche2/traces.jsonl
  holdout_fraction: 0.2
  metrics:
  - task_success_rate
  - step_efficiency
  - memory_utilization
  - dreambank_lift
dreambank:
  cycles: 2
  max_seeds: 32
  min_margin: 0.05
  max_writes_per_cycle: 8
  enforce_zero_grad: true
  temperatures:
  - 0.2
  - 0.7
  - 1.0
  - 1.3
  bank:
    bank_size: 14
    bank_dim: 64
reproducibility:
  record_git_sha: true
  record_config_hash: true
  record_param_hash: true
  output_dir: docs/reproducibility/ring1_tranche3
