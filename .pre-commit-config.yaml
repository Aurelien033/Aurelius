repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deployment/helm/
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [tokenizers>=0.20, numpy>=1.26]
        args: [--ignore-missing-imports]
        files: ^(src|agent|aurelius_cli|gateway|acp_adapter|cron|plugins|tools)/

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast unit tests)
        language: system
        entry: python -m pytest tests/ -x -q --tb=short --ignore=tests/ui
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: bandit-security
        name: bandit (security scan)
        language: system
        entry: .venv/bin/bandit -q -ll -r src agent gateway aurelius_cli
        pass_filenames: false
        stages: [pre-push]
      - id: pip-audit
        name: pip-audit (dependency scan)
        language: system
        entry: .venv/bin/python -m pip_audit --skip-editable --progress-spinner off
        pass_filenames: false
        stages: [pre-push]
      - id: check-torch-load
        name: check torch.load weights_only
        entry: python hooks/check_torch_load.py
        language: system
        types: [python]
