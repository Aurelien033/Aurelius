name: Ruff Autofix

# Enforces ruff formatting/lint cleanliness. Fails with a fix-it message when
# code needs `ruff format` or `ruff check --fix` — no bot PRs (this repo has
# GitHub Actions PR creation disabled, which made the previous peter-evans
# auto-fix step crash CI with "GitHub Actions is not permitted to create or
# approve pull requests").

on:
  push:
    branches-ignore: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        # Pinned to the repo's dev-dependency floor; must match [tool.ruff] in
        # pyproject.toml so local and CI results agree.
        run: pip install ruff==0.15.12

      - name: Ruff format
        run: ruff format src/ tests/ agent/ aurelius_cli/ gateway/ acp_adapter/ cron/ plugins/ tools/

      - name: Ruff fix
        # --ignore=I001 matches ci.yml's lint gate so the two jobs agree.
        run: ruff check --fix --ignore=I001 src/ tests/ agent/ aurelius_cli/ gateway/ acp_adapter/ cron/ plugins/ tools/

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on unformatted code
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::ruff found formatting/lint fixes to apply. Run locally and push:"
          echo "::error::  ruff format src/ tests/ agent/ aurelius_cli/ gateway/ acp_adapter/ cron/ plugins/ tools/"
          echo "::error::  ruff check --fix src/ tests/ agent/ aurelius_cli/ gateway/ acp_adapter/ cron/ plugins/ tools/"
          git diff --stat
          exit 1
