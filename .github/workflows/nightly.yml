name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-tests:
    name: Extended regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Security perimeter + hardening regressions
        run: |
          python tests/security/run_security_audit.py --output /tmp/security_audit.json

      - name: Extended serving, agent sandbox, and tools tests
        run: |
          timeout 1800 python -m pytest \
            tests/security/ \
            tests/serving/ \
            tests/tools/ \
            tests/training_data/ \
            tests/agent/test_plugin_sandbox.py \
            tests/agent/test_code_execution_sandbox.py \
            -q --tb=short --maxfail=25

      - name: Shard diversity audit (NEW-04)
        run: |
          python scripts/audit_tokenized_shards.py training_data/tokenized \
            --output /tmp/shard-audit.json || true
