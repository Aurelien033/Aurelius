version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "Aurelien033"
    labels:
      - "dependencies"
      - "python"
    groups:
      torch-deps:
        patterns:
          - "torch*"
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff*"

  # npm sits at the workspace root: the ROOT package-lock.json is the only
  # lockfile used by CI (`npm ci`) and by the Docker builds (context `.`).
  # Per-directory npm entries used to update middle/package-lock.json and
  # server/package-lock.json instead, leaving the root lockfile stale and
  # failing every CI run with "lock file does not satisfy" errors.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "Aurelien033"
    labels:
      - "dependencies"
    groups:
      react-deps:
        patterns:
          - "react*"
          - "@types/react*"
      types-node:
        patterns:
          - "@types/node"
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
    ignore:
      # Major bumps that need migration work before they can pass CI.
      # Tracked in issue #258 — remove an entry when its migration lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/jest-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pino"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "rust"
    ignore:
      # pyo3 0.29 needs binding migration work (issue #258); dependabot
      # classifies 0.x->0.y as minor, so pin the whole span.
      - dependency-name: "pyo3"
        versions: [">=0.29"]

  - package-ecosystem: "docker"
    directory: "/deployment"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
