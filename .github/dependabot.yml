version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "Aurelien033"
    labels:
      - "dependencies"
      - "python"
    groups:
      torch-deps:
        patterns:
          - "torch*"
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff*"

  # npm sits at the workspace root: the ROOT package-lock.json is the only
  # lockfile used by CI (`npm ci`) and by the Docker builds (context `.`).
  # Per-directory npm entries used to update middle/package-lock.json and
  # server/package-lock.json instead, leaving the root lockfile stale and
  # failing every CI run with "lock file does not satisfy" errors.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "Aurelien033"
    labels:
      - "dependencies"
    groups:
      react-deps:
        patterns:
          - "react*"
          - "@types/react*"
      types-node:
        patterns:
          - "@types/node"
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "docker"
    directory: "/deployment"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
