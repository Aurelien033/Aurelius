# Aurelius-Forge 1B — AMC-first hybrid transformer (~1.05B parameters)
# 24 layers: 12 MLA attention (even) + 12 AMC-SSM (odd)
# Validate: python scripts/validate_amc_forge_config.py

model:
  name: aurelius-forge-1b-amc
  vocab_size: 128000
  d_model: 1792          # 2048 overshoots ~1.33B; 1792 targets ~1.05B
  n_layers: 24
  n_heads: 16
  kv_lrank: 64
  ssm_d_state: 64
  ssm_expand: 2
  ssm_headdim: 64
  d_conv: 4
  max_seq_len: 4096
  tie_embeddings: true
  promotion_temperature: 0.5
  rope_theta: 10000.0

training:
  batch_size: 16
  gradient_accumulation: 4
  gpus: 4
  effective_batch_size: 256   # 16 * 4 * 4
  learning_rate: 3.0e-4
  promotion_gate_lr: 1.0e-4
  surprise_head_lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 50000
  eval_every: 500
  checkpoint_every: 2000
  grad_clip: 1.0
  loss_weights:
    sft: 0.70
    surprise: 0.15
    consistency: 0.10
    promotion: 0.05

data:
  train_tokens: 10000000
  max_seq_len: 2048
  source: redpajama-sample
  train_split: 0.9
  eval_split: 0.1

compute:
  gpus: 4
  gpu_type: A100-40GB
  strategy: deepspeed_zero2
  precision: bf16
  deepspeed_config: configs/deepspeed_zero2.json

evaluation:
  eval_batch_size: 8
  eval_max_batches: 100
