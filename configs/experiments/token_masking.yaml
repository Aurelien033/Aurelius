# Token-Level Difficulty Masking experiment config
include: sft_base.yaml

experiment:
  name: token_difficulty_masking
  module: src.training.loss_masking
  class: TokenDifficultyMask

loss_masking:
  mask_ratio: 0.5
  use_decay_schedule: true
  start_ratio: 0.7
  end_ratio: 0.3
  total_steps: 1000
  temperature: 1.0
  min_valid_tokens: 4

ablations:
  mask_ratios: [0.0, 0.3, 0.5, 0.7]
  compare_metrics: [loss, accuracy, ece, grad_norm]
