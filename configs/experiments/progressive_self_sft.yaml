# Progressive Self-SFT experiment config
include: sft_base.yaml

experiment:
  name: progressive_self_sft
  module: src.training.progressive_self_sft
  class: ProgressiveSelfSFT

progressive:
  stage_temperatures: [0.5, 0.7, 0.3, 0.5]
  stage_samples: [1, 3, 3, 2]
  stage_epochs: [2, 2, 1, 1]
  stage_learning_rates: [2e-5, 1e-5, 5e-6, 5e-6]
  difficulty_labels: [easy, medium, hard, critique]
  checkpoint_dir: checkpoints/progressive_self_sft
