claims:

  - claim_id: CLM-001
    text: >
      A controller allocating compute by expected verified marginal gain per unit
      compute (estimator ladder g_entropy -> g_gain -> g_VBMCA) beats entropy-only
      routing on accuracy/FLOP at matched FLOPs, bytes, params, and guard coverage.
    evidence_level: hypothesis
    source_sections: ["§142.2", "§128", "§100"]
    required_artifacts: [E87_run_manifest, E87_results, chessboard_entropy_row]
    forbidden_contexts: ["entropy-as-objective phrasing (§126.1 rule 4)"]
    paper_eligible: false
    notes: "THE Paper-1 thesis claim. If falsified, plan honestly reduces to entropy routing and reports it."
    e87_preregistration: "e87_preregistration.yaml (E87-PREREG-v0.1, FROZEN, OBL-056). split_hash c21e22915fd52972; clean families F2 + gym-v0.3 F3."
    e87_result:   # FIRST real thesis evidence, 2026-06-14 — a precise NEGATIVE for the per-layer g_gain rung
      run: "e87 chessboard (60 held-out test instances, k=4, 3 seeds; independent re-score AGREE=900/900)"
      verification: "e87_receipt/e87_VERIFICATION.md"
      rates: {dense: 0.733, random: 0.300, learned_gain: 0.200, oracle: 0.083, entropy: 0.017}
      finding: >
        FALSIFIED at the g_gain-per-layer rung: NO informed skip policy beat random (learned 20% <
        random 30%; H-E87-2 fails). learned_gain > entropy (+18.3pp) but both lose to random, so it is
        not thesis support. Mechanism: LAYER NON-ADDITIVITY — single-layer leave-one-out gain (the
        §134.5 g_gain target) anti-predicts joint skip-set value; informed policies concentrate skips in
        the early block (oracle 79% in layers 7-10) which is individually safe but jointly catastrophic
        (oracle 8.3%, entropy 1.7%); random spreads and wins.
      NOT_concluded: "NOT 'no learnable signal exists' — the prereg's oracle was a GREEDY single-layer-marginal selector, not a true combinatorial ceiling; H-E87-0's auto-'NO SIGNAL' is corrected/invalid. A combinatorial oracle must run before any no-signal claim."
      redirects: "per-layer marginal estimators (the §134.5 g_gain construction) are the wrong tool. Next: interaction-aware/combinatorial selection, OR token-level routing (additivity may hold better per-token), OR g_VBMCA with joint features, plus a true combinatorial oracle."
      evidence_level_after: "hypothesis (g_gain-per-layer form FALSIFIED for this construction; the broader CLM-001 stays open pending interaction-aware / token-level / g_VBMCA tests)"
      k_sweep_reframe_2026_06_14: >
        SAME DAY the verdict was REFRAMED (k=1 analysis, free from Phase A exhaustive single-skip labels;
        e87_VERIFICATION.md ADDENDUM). The 'falsified' read was too blunt — it was specific to the
        aggressive k=4 point. At k=1: achievable ceiling 91.7% (>> dense 73% => signal is LARGE), and
        ENTROPY ROUTING BEATS DENSE (75% > 73.3%) => the CORE thesis (routing helps) is SUPPORTED at the
        right operating point. CLM-001's LITERAL claim (g_gain beats entropy) stays UNSUPPORTED (entropy
        >= learned at every k; my linear g_gain is mediocre, real directional signal but < entropy). The
        k-sweep (k=2/4 true combinatorial ceiling, OBL-057) is running to map cost-vs-selectability.
        Net: routing helps at small k; the verified-gain ESTIMATOR needs to be better than entropy AND
        the operating point (k, per-layer vs per-token) is the critical design variable E87 surfaced.
      k_sweep_combinatorial_2026_06_14: >
        THE DECISIVE RESULT (OBL-057 combinatorial achievable-ceiling, sampled N=20/instance; verified:
        recompute exact + GPU spot-re-score). Achievable ceiling by k: k1 91.7%, k2 91.7%, k4 71.7%
        (~= dense 73.3%) while avg random skip collapses (k1 54% -> k2 39% -> k4 15%). GOOD SKIP-SETS
        EXIST AT EVERY k and the ceiling-vs-random gap GROWS with k (+37 -> +53 -> +57pp). The verified-
        gain ROUTING thesis is ALIVE and the prize is LARGE (near-dense accuracy at reduced layer-compute
        is achievable). E87's 'no signal' was DECISIVELY WRONG — it was a SELECTION failure, not a signal
        failure. The ONLY thing falsified is the per-layer-marginal ESTIMATOR. Open problem (singular):
        learn a combinatorial/interaction-aware selector, or co-train skip-robustness (OBL-059). Best
        operating point = k=2 (ceiling 91.7%, random 39% — widest realized headroom). evidence_level:
        CLM-001 routing-helps SUPPORTED at the achievable-ceiling level; the LEARNED-selector form OPEN.
      k_sweep_correction_2026_06_15: >
        LANGUAGE CORRECTION (external-model audit of EXTERNAL_BRIEF.md, re-verified by me against the raw
        ksweep_results.jsonl: k=2 median 18 distinct sets/task of 91, k=4 median 20 of 1001). The k=2/k=4
        "achievable ceiling" is BEST-OF-~20 SAMPLED, NOT a true combinatorial/exhaustive oracle (k=1 IS
        exhaustive, 14 sets). Two consequences: (1) the reported ceilings (k2 91.7%, k4 71.7%) are a LOWER
        BOUND on the true exhaustive ceiling, so "good skip-set exists at every k" SURVIVES (only strengthens
        — true ceiling >= reported); (2) best-of-20 is VERIFIER-ASSISTED SEARCH (20 verifier calls), NOT a
        cheap deployable selector — "a good set exists" must stay distinct from "a cheap selector finds it."
        The 80/80 GPU re-score verified LABEL honesty (pass/fail correct), NOT search exhaustiveness. Reframe
        (more accurate): good sets are COMMON (55/60 tasks hit by 20 random tries at k=2 => dense basin, not
        needle-in-haystack), so selection is PLAUSIBLY learnable but UNTESTED. Fix going forward: the exact
        k=2 pair matrix (all 91 pairs x 60 tasks) makes k=2 truly exhaustive AND yields the dataset for a
        pairwise compatibility selector with task-level splits. Files corrected: this entry, EXTERNAL_BRIEF.md,
        e87_VERIFICATION.md (addendum), MEMORY.md. Credit: external brainstorm response 2026-06-15.
      selection_arc_2026_06_17: >
        THE SELECTION QUESTION, ANSWERED (full arc: aurelius_selection_arc_writeup_2026-06-17.md).
        (1) EXACT k=2 matrix (all 91 pairs x 60 tasks, Kaggle fp16, re-derived): TRUE ceiling 96.7% (> dense
        75%), avg-random 38.9% — a good pair EXISTS for 58/60 tasks; replaces the sampled 91.7/38.7.
        (2) PER-TASK PROMPT-CONDITIONED SELECTOR = POWERED NULL (selector_pertask_preregistration.yaml,
        N=300 representative pool, kernel notebook0b2b9081aa). Held-out CV: random 36, dense 62, global-best-
        pair 68.3, C_struct 68.3, C_full 68.3 (H-SEL-1 = +0.0pp), oracle 89.7. corr(logit-space pair-align,
        pass) = +0.020 (MODEL-FREE: the mechanistic feature is dead). The ~21pp per-task headroom is NOT
        cheaply capturable from prefill activations + a linear model. SECOND powered null (one rung up from
        the g_gain kill).
        (3) THE SURVIVING POSITIVE: a FIXED GLOBAL skip set (a permanent structural prune) >= dense on the
        representative pool (68.3 vs 62) — but POOL-DEPENDENT (on the easy-60 it was 56.7 < dense 75) and
        MODEST. Honest reframe: this is a STRUCTURED DEPTH-PRUNING result (non-additive: poison layers
        11/14/15 + adjacency, NOT 'early layers'), not Aurelius's original cheap dynamic per-token routing.
        (4) CO-TRAIN route KILLED (OBL-059 v2): making all skips cheap -> uniform mediocrity.
        NET evidence_level for CLM-001: the cheap-estimator AND cheap-per-task-selector forms are FALSIFIED
        (two powered nulls); what stands is non-additive structured pruning (>= dense, modest); the large
        per-task headroom is REAL but not-cheaply-capturable = the central open problem. k=4 (OBL-061,
        running) tests whether a permanent 4-layer prune is a deployable win.

