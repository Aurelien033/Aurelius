# Aurelius V3 Claims Ledger — the honest record of what is measured, refuted, or noise.
# Seeded 2026-07-07 from the settled research log. Every row: metric, baseline,
# falsifier, rollback, value, n, status. Loaded/appended by src/eval/truth_surface.py.
# status: confirmed | refuted | noise | proposed
#
# THE LEVER MAP (what the ledger says): capacity + verified selection/search are the
# only confirmed capability levers; frozen-base routing, SFT-for-capability, RLVR@lr1e-6,
# zero-shot verifier rerank, and tapered-FFN are refuted/noise.

- claim_id: cap-8b-14b
  statement: "Bigger base lifts held-out code: Qwen3-14B > Qwen3-8B."
  metric: "HumanEval pass@1"
  baseline: "Qwen3-8B base 84.1%"
  falsifier: "14B <= 8B + noise on a less-saturated bench"
  rollback: "stay on 8B base"
  value: 88.4
  baseline_value: 84.1
  n: 164
  status: confirmed
  bench: humaneval
  notes: "+4.3pp; the single proven capability lever. MBPP +? wider on the less-saturated bench."

- claim_id: cap-14b-30b-math
  statement: "30B-A3B >> 14B on reasoning (capacity gap lives on MATH, not saturated code)."
  metric: "MATH-500 accuracy"
  baseline: "Qwen3-14B 52.0%"
  falsifier: "30B-A3B <= 14B + noise on MATH"
  rollback: "14B base"
  value: 85.0
  baseline_value: 52.0
  n: 100
  status: confirmed
  bench: math-500
  notes: "+33pp — robust to scoring noise. Code gap only +1.5pp MBPP (both at MBPP ceiling)."

